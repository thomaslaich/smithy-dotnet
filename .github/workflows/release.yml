name: Release
on:
  release:
    types:
      - published
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Resolve release version
        id: version
        # Strip a leading `v` from the release tag (e.g. v0.1.0 -> 0.1.0).
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          if [ -z "$version" ]; then
            echo "::error::Release tag '${tag}' did not yield a version."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${version}"
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Configure devenv cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Publish codegen JAR to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: devenv shell -- just publish-codegen "${{ steps.version.outputs.version }}"
      - name: Build, test, and pack
        # NSmithy.* .nupkg version comes from the release tag (overrides
        # VersionPrefix/VersionSuffix in Directory.Build.props). Tests still
        # build against the local SNAPSHOT codegen JAR published to ~/.m2 by
        # `just codegen` so test smithy-build.json files don't need to be
        # rewritten at release time.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: devenv shell -- just ci
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
      - name: Publish packages to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          NUGET_API_KEY_TOOL: ${{ secrets.NUGET_API_KEY_TOOL }}
        run: |
          dotnet nuget push "artifacts/packages/dotnet-nsmithy.*.nupkg" --api-key "$NUGET_API_KEY_TOOL" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
          dotnet nuget push "artifacts/packages/NSmithy.*.nupkg" --api-key "$NUGET_API_KEY" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
