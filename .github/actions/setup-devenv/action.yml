name: Set up devenv
description: Restore the dependency caches and install Nix and devenv, so later steps can run `devenv shell`.
runs:
  using: composite
  steps:
    - name: Cache build dependencies
      uses: ./.github/actions/cache-dependencies
    - name: Install Nix
      uses: cachix/install-nix-action@v31
    - name: Configure devenv cache
      uses: cachix/cachix-action@v17
      with:
        name: devenv
    - name: Install devenv
      shell: bash
      run: nix profile add nixpkgs#devenv
