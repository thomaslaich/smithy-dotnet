name: Cache build dependencies
description: Reuse external dependencies across CI, PR validation, and release builds.
runs:
  using: composite
  steps:
    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        # These packages are rebuilt locally with a fixed snapshot version.
        # Restoring them would let examples consume code from an earlier run.
        path: |
          ~/.nuget/packages/*
          !~/.nuget/packages/nsmithy.*
          !~/.nuget/packages/dotnet-nsmithy
        key: ${{ runner.os }}-${{ runner.arch }}-nuget-v1-${{ hashFiles('global.json', 'devenv.lock', '**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.config') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-nuget-v1-
    - name: Cache Gradle dependencies
      uses: actions/cache@v5
      with:
        # Only cache downloaded dependencies; codegen outputs and the locally
        # published Maven repository must be regenerated by the current build.
        path: |
          ~/.gradle/caches/modules-2/files-2.1/*
          ~/.gradle/caches/modules-2/metadata-*
          !~/.gradle/caches/modules-2/files-2.1/io.github.thomaslaich.nsmithy
        key: ${{ runner.os }}-${{ runner.arch }}-gradle-deps-v1-${{ hashFiles('devenv.lock', '**/*.gradle.kts', '**/gradle.properties') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-gradle-deps-v1-
    - name: Cache bundled Smithy CLI
      uses: actions/cache@v5
      with:
        path: packages/NSmithy.MSBuild/tools/smithy-cli
        # The downloader skips existing launchers, so never restore a cache
        # made with a different CLI version or checksum set.
        key: ${{ runner.os }}-${{ runner.arch }}-smithy-cli-v1-${{ hashFiles('packages/NSmithy.MSBuild/tools/download-smithy-cli.sh') }}
