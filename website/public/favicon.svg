<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">NSmithy favicon</title>
  <desc id="desc">A compact NSmithy favicon combining a stylized letter N with an anvil shape.</desc>
  <defs>
    <linearGradient id="steel" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fb7ff"/>
      <stop offset="0.52" stop-color="#6d7cff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="edge" x1="16" y1="14" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- outer stamp, works on light and dark backgrounds -->
  <path filter="url(#softShadow)" fill="#111827" d="M32 4 55.25 17.5v29L32 60 8.75 46.5v-29L32 4Z"/>
  <path fill="url(#steel)" d="M32 7.5 52.25 19.25v25.5L32 56.5 11.75 44.75v-25.5L32 7.5Z"/>
  <path fill="none" stroke="url(#edge)" stroke-width="1.5" d="M32 8.75 51.15 19.85v24.3L32 55.25 12.85 44.15v-24.3L32 8.75Z"/>

  <!-- anvil silhouette -->
  <path fill="#0f172a" fill-opacity="0.92" d="M15.5 42.25h33v4.5h-33v-4.5Zm7-7.25h20.25c3.25 0 5.95-1.55 7.8-4.5H43.7c-2.3 0-4.35-.55-6.1-1.65l-1.75-1.1H22.5V35Zm2.5 0 3.2 7.25h7.6L39 35H25Z"/>

  <!-- stylized N cut/mark -->
  <path fill="#f8fafc" d="M20 18h6.45l11.1 17.1V18H44v25.7h-6.45L26.45 26.6v17.1H20V18Z"/>
  <path fill="#bfdbfe" opacity="0.9" d="M26.45 18 44 43.7h-6.45L20 18h6.45Z"/>
</svg>
